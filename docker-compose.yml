# Trợ lý pháp luật lao động — stack local.
# Core (mặc định): postgres (pgvector) + api + web.
# Quan sát (profile "obs"): langfuse. Bật bằng:  docker compose --profile obs up -d
#
#   Web UI   : http://localhost:3000
#   API docs : http://localhost:8000/docs
#   Langfuse : http://localhost:3002   (chỉ khi bật profile obs)

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawvn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawvn-dev}
      POSTGRES_DB: ${POSTGRES_DB:-lawvn}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawvn} -d ${POSTGRES_DB:-lawvn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lawvn}:${POSTGRES_PASSWORD:-lawvn-dev}@postgres:5432/${POSTGRES_DB:-lawvn}
      # máy nhà không gánh mô hình 7B cho việc nền (theo dõi văn bản mới, phân tích hồ sơ…): dữ liệu
      # mức C (đã che) đi đám mây; mức A/B vẫn chỉ mô hình trong máy. Đặt false để quay lại trong máy trước.
      CLOUD_FIRST_FOR_C: ${CLOUD_FIRST_FOR_C:-true}
      NO_LOCAL_FOR_C: ${NO_LOCAL_FOR_C:-true}
      CLOUD_SPREAD_MODELS: ${CLOUD_SPREAD_MODELS:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      # thư mục inbox (LI4): luật sư tự tải toàn văn về rồi thả vào đây, đọc-ghi để chuyển tệp sang done/
      - ./inbox:/inbox
      - modelcache:/root/.cache
      # key mô hình đám mây (CLOUD_LLM_KEYS_DIR), chỉ đọc; keys/ nằm trong .gitignore và .dockerignore
      - ./keys:/keys:ro
    # GPU chỉ dùng cho chép lời tức thì khi có người bấm micro (STT_LIVE_DEVICE=auto), model tự
    # giải phóng sau 5 phút; đặt STT_LIVE_DEVICE=cpu trong .env để không đụng GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
    environment:
      # Trình duyệt gọi API qua localhost; SSR trong container gọi qua tên service.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Bind mount trên Windows không bắn sự kiện file-watch -> bật polling để hot-reload.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
      - "3001:3000"   # xem frontend/lib/mode.ts
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

  # --- Quan sát (tùy chọn, M7) ---
  langfuse:
    image: langfuse/langfuse:2
    profiles: ["obs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lawvn}:${POSTGRES_PASSWORD:-lawvn-dev}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-dev-secret}
      SALT: ${LANGFUSE_SALT:-change-me-dev-salt}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  modelcache:
